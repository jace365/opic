<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F3D34">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="오픽 산책">
<meta name="description" content="Jace의 OPIc 말하기 연습 앱: 주제별 IM1~AL 답안, 발음 교정, 실전 테스트">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>오픽 산책 — OPIc 말하기 연습</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
:root{
  --pine:#1F3D34; --moss:#5E7F6E; --sage:#DDE7E0; --paper:#F5F7F4; --card:#FFFFFF;
  --ink:#17201C; --mute:#5C6862; --line:#D3DCD6; --amber:#C98424; --amber-bg:#FBF1E1;
  --ok:#2F7A4F; --ok-bg:#E3F2E8; --close:#A7741B; --close-bg:#FBF0D9; --miss:#B5473A; --miss-bg:#F8E3E0;
  --l1:#A9C2B3; --l2:#76A08A; --l3:#44725E; --l4:#1F3D34;
  --sans:"IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --serif:"Source Serif 4", Georgia, "Times New Roman", serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --pine:#9CC7B2; --moss:#7FA592; --sage:#23332D; --paper:#121916; --card:#1A231F; --ink:#E6EEE9; --mute:#9AA8A1; --line:#2E3D36;
  --amber:#E3A74C; --amber-bg:#34291A; --ok:#7CCB9A; --ok-bg:#1D3326; --close:#E2B560; --close-bg:#352B18; --miss:#EC8A7E; --miss-bg:#3A2320;
  --l1:#4A6357; --l2:#5E8671; --l3:#7FAE95; --l4:#B4DCC6; }}
:root[data-theme="dark"]{
  --pine:#9CC7B2; --moss:#7FA592; --sage:#23332D; --paper:#121916; --card:#1A231F; --ink:#E6EEE9; --mute:#9AA8A1; --line:#2E3D36;
  --amber:#E3A74C; --amber-bg:#34291A; --ok:#7CCB9A; --ok-bg:#1D3326; --close:#E2B560; --close-bg:#352B18; --miss:#EC8A7E; --miss-bg:#3A2320;
  --l1:#4A6357; --l2:#5E8671; --l3:#7FAE95; --l4:#B4DCC6; }
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* Header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:1px solid var(--line)}
.bar{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:20px;padding:12px 20px}
.brand{display:flex;align-items:baseline;gap:8px;margin-right:auto}
.brand b{font-size:19px;font-weight:700;color:var(--pine);letter-spacing:-.02em}
.brand span{font-size:12px;color:var(--mute)}
nav.tabs{display:flex;gap:4px;background:var(--sage);padding:4px;border-radius:10px}
nav.tabs button{border:0;background:transparent;padding:7px 16px;border-radius:7px;font-weight:600;font-size:14px;color:var(--mute)}
nav.tabs button[aria-selected="true"]{background:var(--card);color:var(--pine);box-shadow:0 1px 2px rgba(20,40,30,.12)}

main{max-width:1180px;margin:0 auto;padding:24px 20px 80px}

/* Study layout */
.study{display:grid;grid-template-columns:220px 1fr;gap:32px;align-items:start}
.topics{position:sticky;top:84px;display:flex;flex-direction:column;gap:2px}
.topics h2{font-size:12px;color:var(--mute);font-weight:500;margin:0 0 8px 10px}
.topics button{border:0;background:transparent;text-align:left;padding:9px 12px;border-radius:8px;font-size:15px;color:var(--ink);border-left:3px solid transparent}
.topics button:hover{background:var(--sage)}
.topics button[aria-current="true"]{background:var(--card);border-left-color:var(--pine);font-weight:600;color:var(--pine)}

.qhead{margin-bottom:22px}
.qhead .q{font-family:var(--serif);font-size:24px;line-height:1.35;margin:0 0 6px;font-weight:600;color:var(--ink);max-width:36em}
.qhead .qko{color:var(--mute);margin:0 0 10px}
.rptip{margin:0 0 12px;padding:8px 12px;background:var(--amber-bg);border-radius:8px;font-size:14px;max-width:44em}
.qhead .qplay{display:inline-flex;gap:8px}

/* Trail level selector: the signature element */
.trail{position:relative;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px 16px;margin-bottom:18px}
.trail-title{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px;gap:12px;flex-wrap:wrap}
.trail-title strong{font-size:14px;color:var(--pine)}
.trail-title small{color:var(--mute);font-size:13px}
.trail-steps{position:relative;display:grid;grid-template-columns:repeat(4,1fr);align-items:end;gap:0}
.trail-svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.step{position:relative;z-index:1;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:6px;padding:0 4px}
.step .dot{width:18px;height:18px;border-radius:50%;background:var(--card);border:3px solid var(--c);transition:transform .15s}
.step .lv{font-weight:700;font-size:15px;color:var(--c)}
.step .meta{font-size:12px;color:var(--mute);line-height:1.3;text-align:center}
.step[aria-pressed="true"] .dot{background:var(--c);transform:scale(1.25)}
.step[aria-pressed="true"] .lv{text-decoration:underline;text-underline-offset:4px}
.step:hover .dot{transform:scale(1.15)}
.lvnote{margin:14px 0 0;font-size:13px;color:var(--mute)}

/* Toolbar */
.toolbar{position:sticky;top:61px;z-index:10;background:var(--paper);display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;padding:10px 0;margin-bottom:6px;border-bottom:1px solid var(--line)}
.toggle{display:inline-flex;align-items:center;gap:8px;font-size:14px;cursor:pointer;user-select:none}
.toggle input{appearance:none;width:34px;height:20px;border-radius:20px;background:var(--line);position:relative;margin:0;cursor:pointer;transition:background .15s}
.toggle input::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s}
.toggle input:checked{background:var(--pine)}
.toggle input:checked::after{left:16px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--card);padding:5px 10px;font-size:13px;color:var(--mute)}
.seg button[aria-pressed="true"]{background:var(--pine);color:var(--paper)}
.spacer{flex:1}
.btn{border:1px solid var(--line);background:var(--card);padding:7px 14px;border-radius:8px;font-size:14px;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--moss)}
.btn.primary{background:var(--pine);border-color:var(--pine);color:var(--paper)}
.btn.rec{background:var(--amber);border-color:var(--amber);color:#fff}
.btn.rec.live{animation:pulse 1.2s infinite}
.btn[disabled]{opacity:.45;cursor:not-allowed}
@keyframes pulse{50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--amber) 30%,transparent)}}
@media (prefers-reduced-motion:reduce){.btn.rec.live{animation:none}.step .dot{transition:none}}
.ico{width:16px;height:16px;flex:none}

/* Sentences */
.sents{list-style:none;margin:0;padding:0}
.sent{padding:18px 10px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:30px 1fr;gap:4px 10px}
.sent.playing .en{background:var(--amber-bg);box-shadow:0 0 0 4px var(--amber-bg);border-radius:3px}
.sent .n{font-size:13px;color:var(--mute);padding-top:5px;font-variant-numeric:tabular-nums}
.sent .en{font-family:var(--serif);font-size:20px;line-height:1.45;margin:0;max-width:40em}
.sent .ko{margin:6px 0 0;color:var(--ink);font-size:14.5px;opacity:.85}
.sent .pr{margin:2px 0 0;color:var(--moss);font-size:14px}
.hide-ko .ko,.hide-pr .pr{display:none}
.acts{grid-column:2;display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.acts .btn{padding:5px 11px;font-size:13px}
.check{grid-column:2;margin-top:12px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.check .status{font-size:13.5px;color:var(--mute);margin:0}
.words{font-family:var(--serif);font-size:19px;line-height:1.9;margin:4px 0 8px}
.w{padding:1px 3px;border-radius:4px;cursor:pointer}
.w.ok{background:var(--ok-bg);color:var(--ok)}
.w.close{background:var(--close-bg);color:var(--close);text-decoration:underline dotted}
.w.miss{background:var(--miss-bg);color:var(--miss);text-decoration:line-through}
.score{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:6px}
.score .big{font-size:28px;font-weight:700;color:var(--pine);font-variant-numeric:tabular-nums}
.score .lbl{font-size:13px;color:var(--mute)}
.heard{font-size:13.5px;color:var(--mute);margin:0 0 8px}
.heard b{color:var(--ink);font-weight:500}
.tips{margin:8px 0 0;padding-left:18px;font-size:14px}
.tips li{margin:3px 0}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--mute);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.pats{display:flex;flex-wrap:wrap;gap:8px;margin:22px 0 0}
.pat{background:var(--sage);border-radius:8px;padding:8px 12px;font-size:13.5px}
.pat b{font-family:var(--serif);font-size:15px;font-weight:600;margin-right:6px}
.sec-t{font-size:14px;font-weight:600;color:var(--pine);margin:30px 0 4px}

/* Compare */
.compare{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:16px}
.cmp{background:var(--card);border:1px solid var(--line);border-top:4px solid var(--c);border-radius:10px;padding:14px}
.cmp h3{margin:0 0 2px;font-size:15px;color:var(--c)}
.cmp .wc{font-size:12px;color:var(--mute);margin-bottom:8px}
.cmp p{font-family:var(--serif);font-size:15px;line-height:1.55;margin:0}

/* Test */
.test{max-width:760px;margin:0 auto}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:26px}
.panel h2{margin:0 0 6px;font-size:22px;color:var(--pine)}
.panel p.lead{margin:0 0 20px;color:var(--mute)}
.field{margin:18px 0}
.field label.t{display:block;font-weight:600;font-size:14px;margin-bottom:8px}
.choices{display:flex;gap:8px;flex-wrap:wrap}
.choices button{border:1px solid var(--line);background:var(--paper);padding:8px 16px;border-radius:8px;font-size:14px}
.choices button[aria-pressed="true"]{border-color:var(--pine);background:var(--pine);color:var(--paper)}
.steps-list{margin:0;padding-left:20px;color:var(--mute);font-size:14px}
.steps-list li{margin:4px 0}
.examiner{display:flex;gap:18px;align-items:center;margin-bottom:18px}
.avatar{width:64px;height:64px;border-radius:50%;background:var(--sage);display:grid;place-items:center;flex:none;position:relative}
.avatar svg{width:40px;height:40px;color:var(--pine)}
.avatar.talk::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:2px solid var(--amber);animation:ring 1.2s infinite}
@keyframes ring{50%{inset:-9px;opacity:.3}}
@media (prefers-reduced-motion:reduce){.avatar.talk::after{animation:none}}
.progress{font-size:13px;color:var(--mute)}
.qtext{font-family:var(--serif);font-size:21px;line-height:1.4;margin:6px 0 0}
.qtext.blur{filter:blur(6px);user-select:none}
.timer{font-size:44px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--pine);text-align:center;margin:18px 0 4px;letter-spacing:.02em}
.timer.warn{color:var(--miss)}
.tbar{height:6px;background:var(--sage);border-radius:6px;overflow:hidden;margin-bottom:18px}
.tbar div{height:100%;background:var(--amber);width:0}
.live{min-height:80px;background:var(--paper);border:1px dashed var(--line);border-radius:10px;padding:12px 14px;font-family:var(--serif);font-size:16px;color:var(--mute);margin-bottom:16px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.notice{background:var(--amber-bg);border-radius:10px;padding:10px 14px;font-size:14px;margin:12px 0}
.overall{display:flex;gap:28px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.overall .lvbig{font-size:52px;font-weight:700;color:var(--pine);line-height:1}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}
.metric{background:var(--paper);border-radius:8px;padding:10px 12px}
.metric b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.metric span{font-size:12px;color:var(--mute)}
details.res{border:1px solid var(--line);border-radius:12px;background:var(--card);margin:12px 0;padding:0 18px}
details.res summary{cursor:pointer;padding:16px 0;display:flex;gap:12px;align-items:baseline;list-style:none}
details.res summary::-webkit-details-marker{display:none}
details.res summary .lvtag{font-weight:700;color:var(--pine);min-width:44px}
details.res summary .qs{font-family:var(--serif);font-size:16px}
details.res[open] summary{border-bottom:1px solid var(--line)}
.resbody{padding:14px 0 18px}
.resbody textarea{width:100%;min-height:110px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);font-family:var(--serif);font-size:15px;padding:10px 12px;resize:vertical}
.found{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{font-size:12.5px;padding:3px 9px;border-radius:20px;background:var(--ok-bg);color:var(--ok)}
.chip.no{background:var(--sage);color:var(--mute)}
.model{background:var(--paper);border-radius:10px;padding:12px 14px;margin-top:12px}
.model p{font-family:var(--serif);margin:0 0 6px;font-size:15px}
.ai{border-left:3px solid var(--pine);padding:4px 0 4px 14px;margin-top:14px;font-size:14.5px}
.ai h4{margin:10px 0 4px;font-size:14px;color:var(--pine)}
.ai ul{margin:0;padding-left:18px}
.ai .fix{margin:6px 0}
.ai .fix s{color:var(--miss)}
.ai .fix ins{color:var(--ok);text-decoration:none;font-family:var(--serif);font-size:15px}
.hint{font-size:13px;color:var(--mute)}

/* Mobile */
@media (max-width:860px){
  .study{grid-template-columns:1fr;gap:12px}
  .topics{position:static;flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:4px}
  .topics h2{display:none}
  .topics button{white-space:nowrap;border-left:0;border:1px solid var(--line);background:var(--card)}
  .topics button[aria-current="true"]{border-color:var(--pine);background:var(--pine);color:var(--paper)}
  .compare{grid-template-columns:1fr 1fr}
  .metrics{grid-template-columns:1fr 1fr}
  .qhead .q{font-size:21px}
  .toolbar{top:57px}
}
@media (max-width:560px){
  .bar{padding:10px 14px;gap:10px}
  .brand span{display:none}
  nav.tabs button{padding:6px 10px;font-size:13px}
  main{padding:16px 14px 60px}
  .compare{grid-template-columns:1fr}
  .sent{grid-template-columns:22px 1fr}
  .sent .en{font-size:18px}
  .step .meta{display:none}
  .panel{padding:18px}
  .timer{font-size:36px}
}

/* App shell (mobile) */
body{overscroll-behavior-y:none;-webkit-tap-highlight-color:transparent}
#installBtn{display:none}
#installBtn.show{display:inline-flex}
.sheet-bg{position:fixed;inset:0;background:rgba(10,20,15,.45);z-index:60;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);color:var(--ink);width:100%;max-width:520px;border-radius:18px 18px 0 0;padding:22px 22px calc(22px + env(safe-area-inset-bottom,0px))}
.sheet h3{margin:0 0 10px;color:var(--pine)}
.sheet ol{margin:0 0 16px;padding-left:20px;line-height:1.9}
@media (max-width:560px){
  header nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;border-radius:0;padding:6px 10px calc(6px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--line);justify-content:space-around}
  header nav.tabs button{flex:1;padding:10px 0;font-size:14px}
  main{padding-bottom:calc(90px + env(safe-area-inset-bottom,0px))}
  .toolbar{top:53px}
  .sent .acts .btn{padding:8px 12px}
}

/* Karaoke-style follow-along highlight */
.kw{border-radius:4px;transition:color .12s,background-color .12s}
.kr .kw{color:var(--mute)}
.kr .kw.done{color:var(--ink)}
.kr .kw.cur{color:var(--card);background:var(--amber);padding:0 3px;margin:0 -3px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.sent{transition:background-color .2s}
.sent.reading{background:var(--amber-bg);border-radius:10px;box-shadow:inset 0 0 0 2px var(--amber),inset 6px 0 0 var(--amber)}
.sent.last:not(.reading){border-radius:10px;box-shadow:inset 4px 0 0 color-mix(in srgb,var(--amber) 55%,transparent)}
.ks{border-radius:4px;transition:background-color .2s}
.ks.reading{background:var(--amber-bg);box-shadow:0 0 0 3px var(--amber-bg),0 2px 0 3px var(--amber)}
.q.reading{background:var(--amber-bg);box-shadow:0 0 0 6px var(--amber-bg);border-radius:4px}
.xp{transition:background-color .2s}
.xp.reading{background:var(--amber-bg);box-shadow:inset 0 0 0 2px var(--amber),inset 6px 0 0 var(--amber)}
.xp.last:not(.reading){box-shadow:inset 4px 0 0 color-mix(in srgb,var(--amber) 55%,transparent)}
.daily2{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px 6px;margin-bottom:20px}
.daily2-h{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:6px 12px;margin-bottom:4px}
.daily2-h strong{font-size:16px;color:var(--pine)}
.daily2-h small{color:var(--mute);font-size:13px}
.daily2-g{display:grid;grid-template-columns:1fr 1fr;gap:0 24px}
.daily2 .xp{border:0;border-radius:10px;padding:12px 10px;background:transparent}
.daily2 .xp.reading{background:var(--amber-bg)}
@media (max-width:760px){ .daily2-g{grid-template-columns:1fr} .daily2 .xp+.xp{border-top:1px solid var(--line)} }
.follow{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--mute)}
@media (prefers-reduced-motion:reduce){.kw{transition:none}}

/* Today strip */
.today{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--amber);border-radius:10px;padding:10px 14px;margin-bottom:18px;font-size:14px}
.today .tdate{font-weight:700;color:var(--amber)}
.today button.link{border:0;background:transparent;padding:0;color:var(--pine);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.tbadge{display:inline-block;margin-left:6px;font-size:11px;font-weight:700;color:#fff;background:var(--amber);border-radius:10px;padding:0 7px;vertical-align:1px}

/* Expressions view */
.xhead h2{margin:0 0 4px;font-size:22px;color:var(--pine)}
.xhead p{margin:0 0 18px;color:var(--mute)}
.xtoday{background:var(--card);border:1px solid var(--line);border-top:4px solid var(--amber);border-radius:14px;padding:18px 20px;margin-bottom:22px}
.xtoday-h{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
.xtoday-h strong{font-size:16px;color:var(--pine)}
.xtoday-h small{color:var(--mute);font-size:13px}
.xfilter{position:sticky;top:61px;z-index:10;background:var(--paper);display:flex;gap:6px;overflow-x:auto;padding:10px 0;border-bottom:1px solid var(--line);margin-bottom:10px;align-items:center}
.xfilter button.chipbtn{flex:none;border:1px solid var(--line);background:var(--card);padding:6px 12px;border-radius:20px;font-size:13px;color:var(--mute);white-space:nowrap}
.xfilter button.chipbtn[aria-pressed="true"]{background:var(--pine);border-color:var(--pine);color:var(--paper)}
.xgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
