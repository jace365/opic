n I traveled to Boracay in the Philippines.","필리핀 보라카이를 여행했을 때 겪은 작은 문제에 대해 말씀드릴게요.","아이드 라익 투 텔 유 어바웃 어 스몰 프라블럼 아이 해드 웬 아이 트래블드 투 보라카이 인 더 필리핀즈."],["The island doesn't have its own airport, so after we landed, we had to take a bus to the port and then catch a boat.","섬에 공항이 없어서 착륙 후 버스로 항구까지 간 다음 배를 타야 했어요.","디 아일랜드 더즌트 해브 잇츠 오운 에어포트, 쏘 애프터 위 랜디드, 위 해드 투 테익 어 버스 투 더 포트 앤 덴 캐치 어 보트."],["It was really hot and humid, and dragging our suitcases on and off the boat was exhausting.","정말 덥고 습했고, 캐리어를 배에 싣고 내리느라 녹초가 됐어요.","잇 워즈 륄리 핫 앤 휴미드, 앤 드래깅 아워 숫케이시즈 온 앤 오프 더 보트 워즈 이그조스팅."],["On top of that, we had to wait in a long line at the port for almost an hour.","게다가 항구에서 거의 한 시간이나 줄을 서서 기다려야 했어요.","온 탑 어브 댓, 위 해드 투 웨잇 인 어 롱 라인 앳 더 포트 포 올모스트 언 아워."],["So on the way back, I booked the resort's transfer service, and they handled everything from the hotel to the airport.","그래서 돌아올 땐 리조트 픽업 서비스를 예약했고, 호텔부터 공항까지 다 처리해 줬어요.","쏘 온 더 웨이 백, 아이 북트 더 리조츠 트랜스퍼 써비스, 앤 데이 핸들드 에브리띵 프럼 더 호텔 투 디 에어포트."],["It cost a little more, but it was definitely worth it.","조금 더 들었지만 확실히 그럴 가치가 있었어요.","잇 코스트 어 리를 모어, 벗 잇 워즈 데피니틀리 워쓰 잇."]],"AL":[["One problem I remember clearly happened on my trip to Boracay in the Philippines.","또렷이 기억나는 문제는 필리핀 보라카이 여행에서 있었어요.","원 프라블럼 아이 리멤버 클리얼리 해픈드 온 마이 트립 투 보라카이 인 더 필리핀즈."],["What a lot of people don't know is that the island doesn't have an airport, so you have to fly to a nearby town and then take a boat.","많은 사람이 모르는 건 섬에 공항이 없어서 근처 도시로 날아간 뒤 배를 타야 한다는 거예요.","왓 어 랏 어브 피플 돈 노우 이즈 댓 디 아일랜드 더즌트 해브 언 에어포트, 쏘 유 해브 투 플라이 투 어 니어바이 타운 앤 덴 테익 어 보트."],["We hadn't looked into the details beforehand, so when we landed, we were totally confused about where to buy boat tickets.","미리 자세히 알아보지 않아서, 착륙했을 때 배표를 어디서 사야 할지 완전히 헤맸어요.","위 해든트 룩트 인투 더 디테일즈 비포핸드, 쏘 웬 위 랜디드, 위 워 토털리 컨퓨즈드 어바웃 웨어 투 바이 보트 티킷츠."],["It was scorching hot, and we ended up waiting in line for almost an hour while dragging our heavy suitcases around.","찌는 듯이 더웠고, 무거운 캐리어를 끌며 결국 거의 한 시간이나 줄을 섰어요.","잇 워즈 스코칭 핫, 앤 위 엔디드 업 웨이팅 인 라인 포 올모스트 언 아워 와일 드래깅 아워 헤비 숫케이시즈 어라운드."],["To be honest, I was pretty frustrated, because I'm not the kind of person who likes moving around a lot on vacation.","솔직히 꽤 짜증이 났어요. 저는 여행 가서 많이 돌아다니는 걸 좋아하는 사람이 아니거든요.","투 비 아너스트, 아이 워즈 프리티 프러스트레이티드, 비코즈 아임 낫 더 카인드 어브 퍼슨 후 라익스 무빙 어라운드 어 랏 온 베케이션."],["So for the return trip, I asked the front desk to arrange a transfer package that covered the boat, the van, and the luggage.","그래서 돌아갈 때는 프런트에 배, 승합차, 짐까지 포함된 픽업 패키지를 요청했어요.","쏘 포 더 리턴 트립, 아이 애스크트 더 프런트 데스크 투 어레인지 어 트랜스퍼 패키지 댓 커버드 더 보트, 더 밴, 앤 더 러기지."],["It was completely stress-free, and we didn't have to lift a single bag.","스트레스가 전혀 없었고, 가방 하나 들 필요가 없었어요.","잇 워즈 컴플리틀리 스트레스 프리, 앤 위 디든 해브 투 리프트 어 싱글 백."],["The lesson I learned is that a little research and a little extra money can save you a lot of trouble.","조금만 알아보고 돈을 조금 더 쓰면 큰 고생을 덜 수 있다는 교훈을 얻었어요.","더 레슨 아이 런드 이즈 댓 어 리를 리서치 앤 어 리를 엑스트라 머니 캔 쎄이브 유 어 랏 어브 트러블."]]}}];
const EXTRA_Q = [{"q":"How has your neighborhood changed since you first moved there?","ko":"처음 이사 온 이후로 동네가 어떻게 변했나요?","ref":"home"},{"q":"What do you usually do with your family on weekends?","ko":"주말에 가족과 보통 무엇을 하나요?","ref":"family"},{"q":"Tell me about a typical day at work, from morning to evening.","ko":"아침부터 저녁까지 회사에서의 일상적인 하루를 말해 주세요.","ref":"work"},{"q":"What do you do to stay healthy? Tell me about your routine.","ko":"건강을 위해 무엇을 하나요? 루틴을 말해 주세요.","ref":"walk"},{"q":"Describe a movie theater you often go to. What does it look like?","ko":"자주 가는 영화관을 묘사해 주세요. 어떻게 생겼나요?","ref":"movie"},{"q":"Tell me about a movie you saw at the theater this year. Who was in it, and what did you think?","ko":"올해 극장에서 본 영화에 대해 말해 주세요. 누가 나왔고, 어땠나요?","ref":"actors"},{"q":"Who is your favorite actor or actress? Why do you like that person?","ko":"가장 좋아하는 배우는 누구인가요? 왜 좋아하나요?","ref":"actors"},{"q":"What are your plans for when you retire?","ko":"은퇴 후에 어떤 계획이 있나요?","ref":"parkgolf"},{"q":"Where did you go on your most recent trip in Korea? Tell me everything you did there.","ko":"최근 국내 여행은 어디로 갔나요? 거기서 한 일을 모두 말해 주세요.","ref":"travel_kr"},{"q":"What do you usually do to prepare for a trip overseas?","ko":"해외여행을 가기 전에 보통 어떤 준비를 하나요?","ref":"travel_abroad"},{"q":"You want to book a trip to Boracay. Call a travel agency and ask three or four questions about the package.","ko":"보라카이 여행을 예약하려고 합니다. 여행사에 전화해 패키지에 대해 서너 가지 질문을 하세요.","ref":"rp_call","cat":"rp"},{"q":"You bought movie tickets online, but you realize they are for the wrong day. Call the theater, explain the situation, and suggest two or three solutions.","ko":"온라인으로 영화표를 샀는데 날짜가 잘못됐습니다. 극장에 전화해 상황을 설명하고 해결책을 두세 가지 제안하세요.","ref":"rp_problem","cat":"rp"}];
const LEVELS = ["IM1","IM3","IH","AL"];
const LEVEL_NOTE = {"IM1":"짧고 단순한 문장, 기본 사실 위주","IM3":"이유와 빈도를 덧붙인 문장","IH":"묘사·순서·비교가 들어간 문단","AL":"시제 변화와 감정, 결론까지 갖춘 이야기"};

<script>

const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const LVC = {IM1:"var(--l1)",IM3:"var(--l2)",IH:"var(--l3)",AL:"var(--l4)"};
const ICON = {
  play:'<svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2.5v11l9-5.5z" fill="currentColor"/></svg>',
  slow:'<svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 3v10l5-5zM9 3v10l5-5z" fill="currentColor" opacity=".8"/></svg>',
  mic:'<svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><rect x="5.5" y="1.5" width="5" height="8" rx="2.5" fill="currentColor"/><path d="M3.5 7.5a4.5 4.5 0 0 0 9 0M8 12v2.5" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round"/></svg>',
  stop:'<svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><rect x="3.5" y="3.5" width="9" height="9" rx="1.5" fill="currentColor"/></svg>',
  me:'<svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="5" r="3" fill="currentColor"/><path d="M2.5 14.5c.7-3 2.9-4.5 5.5-4.5s4.8 1.5 5.5 4.5" fill="currentColor"/></svg>'
};

/* ---------- settings ---------- */
const store = {
  get(k, d){ try{ const v = localStorage.getItem("opicwalk:"+k); return v===null? d : JSON.parse(v);}catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem("opicwalk:"+k, JSON.stringify(v)); }catch(e){} }

/* ---------- speech synthesis ---------- */
let voices = [];
function loadVoices(){ try{ voices = speechSynthesis.getVoices().filter(v=>/^en[-_]US/i.test(v.lang)); }catch(e){} }
if ("speechSynthesis" in window){ loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
function pickVoice(){
  const pref = ["Google US English","Samantha","Microsoft Aria","Microsoft Jenny","Microsoft Zira","Alex"];
  for (const p of pref){ const v = voices.find(v=>v.name.includes(p)); if (v) return v; }
  return voices[0] || null;
}
function speak(text, rate, onend){
  if (!("speechSynthesis" in window)){ toast("이 브라우저는 음성 읽기를 지원하지 않습니다."); onend && onend(); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text.replace(/[“”"]/g,""));
  u.lang = "en-US"; u.rate = rate || S.rate; const v = pickVoice(); if (v) u.voice = v;
  u.onend = () => onend && onend(); u.onerror = () => onend && onend();
  speechSynthesis.speak(u);
}
function stopSpeak(){ try{ speechSynthesis.cancel(); }catch(e){} }

/* ---------- mic / recognition ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
async function getStream(){
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error("nomedia");
  return navigator.mediaDevices.getUserMedia({audio:true});
}
function micErrorText(e){
  const n = e && (e.name || e.error || e.message) || "";
  if (/NotAllowed|not-allowed|Permission|service-not-allowed/i.test(n)) return "마이크 권한이 막혀 있습니다. 주소창 옆 마이크 아이콘에서 허용하거나, 페이지를 새 탭에서 열어 다시 시도하세요.";
  if (/NotFound|audio-capture/i.test(n)) return "마이크를 찾지 못했습니다. 마이크 연결을 확인하세요.";
  if (/nomedia/.test(n)) return "이 환경에서는 녹음을 사용할 수 없습니다. Chrome 또는 Edge에서 열어 주세요.";
  if (/no-speech/.test(n)) return "목소리가 들리지 않았습니다. 마이크 가까이에서 다시 말해 보세요.";
  if (/network/.test(n)) return "음성 인식 서버에 연결하지 못했습니다. 인터넷 연결을 확인하세요.";
  return "녹음을 시작하지 못했습니다. ("+n+")";
}

/* ---------- text compare ---------- */
const NUMW = {zero:0,one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10,eleven:11,twelve:12,thirteen:13,fourteen:14,fifteen:15,sixteen:16,seventeen:17,eighteen:18,nineteen:19,twenty:20,thirty:30,forty:40,fifty:50,sixty:60};
function tokens(s){
  return s.toLowerCase().replace(/[’]/g,"'").replace(/-/g," ").replace(/[^a-z0-9' ]+/g," ").split(/\s+/).filter(Boolean);
}
function normNums(arr){ // join number words into digits: "twenty five" -> "25"
  const out=[];
  for (let i=0;i<arr.length;i++){
    const w=arr[i];
    if (w in NUMW){ let v=NUMW[w]; if (v>=20 && arr[i+1] in NUMW && NUMW[arr[i+1]]<10){ v+=NUMW[arr[i+1]]; i++; } out.push(String(v)); }
    else out.push(w);
  }
  return out;
}
function lev(a,b){
  const m=a.length,n=b.length; if(!m) return n; if(!n) return m;
  let prev=Array.from({length:n+1},(_,j)=>j);
  for(let i=1;i<=m;i++){ const cur=[i]; for(let j=1;j<=n;j++){ cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1)); } prev=cur; }
  return prev[n];
}
function sim(a,b){ if(a===b) return 1; const d=lev(a,b); return 1-d/Math.max(a.length,b.length); }
function align(targetText, spokenText){
  const rawT = targetText.replace(/-/g," ").split(/\s+/).filter(Boolean);
  const T = rawT.map(w=>normNums(tokens(w)).join(" ")).map(w=>w||"");
  const P = normNums(tokens(spokenText));
  const m=T.length,n=P.length;
  const dp=Array.from({length:m+1},()=>new Array(n+1).fill(0));
  const val=(i,j)=>{ const s=sim(T[i],P[j]); return s>=.99?2:(s>=.6?1:-1); };
  for(let i=1;i<=m;i++) for(let j=1;j<=n;j++){
    const v=val(i-1,j-1); dp[i][j]=Math.max(dp[i-1][j], dp[i][j-1], v>0? dp[i-1][j-1]+v : -1e9);
  }
  const res=new Array(m).fill("miss"); let i=m,j=n;
  while(i>0&&j>0){
    const v=val(i-1,j-1);
    if (v>0 && dp[i][j]===dp[i-1][j-1]+v){ res[i-1]= v===2?"ok":"close"; i--; j--; }
    else if (dp[i-1][j]>=dp[i][j-1]) i--; else j--;
  }
  const scoreable = T.filter(t=>t).length || 1;
  let pts=0; res.forEach((r,k)=>{ if(!T[k]) return; pts += r==="ok"?1:(r==="close"?.5:0); });
  return {words:rawT, marks:res, score:Math.round(pts/scoreable*100)};
}
const TIP_RULES = [
  [/th/, "th: 혀끝을 윗니 아래에 살짝 내밀고 바람을 내보내세요. '쓰/드'로 바꾸지 않기 (think, the)."],
  [/v/, "v: 윗니를 아랫입술에 가볍게 대고 목을 울리세요. 'ㅂ'이 아닙니다 (very, movie)."],
  [/f|ph/, "f: 윗니를 아랫입술에 대고 바람만 내보내세요. 'ㅍ'이 아닙니다 (fifty, family)."],
  [/^r|[^aeiou]r/, "r: 혀끝이 입천장에 닿지 않게 뒤로 말아서 소리 내세요 (really, trail)."],
  [/l/, "l: 혀끝을 윗잇몸에 확실히 붙였다 떼세요. 끝의 l은 '어' 소리처럼 약하게 (live, school)."],
  [/z|s$/, "z/s 끝소리: 복수·3인칭 -s를 흘리지 말고 짧게 붙여 발음하세요 (years, works)."],
  [/ed$/, "-ed 끝소리: 과거형 끝을 삼키지 말고 [트]/[드]를 가볍게 남기세요 (walked, moved)."],
  [/^w/, "w: 입술을 동그랗게 모았다가 풀면서 시작하세요 (walk, wife)."]
];
function tipsFor(missed){
  const out=new Set();
  const s = missed.map(w=>w.toLowerCase());
  if (s.some(w=>/^(walk|work|walking|working)$/.test(w))) out.add("walk [웍, 입을 크게, l 묵음] 와 work [워-크, 혀를 말아 r]를 구분하세요.");
  for (const [re,tip] of TIP_RULES){ if (s.some(w=>re.test(w))) out.add(tip); if (out.size>=4) break; }
  return [...out];
}

/* ---------- toast ---------- */

}

      </div>

      <div class="trail">
        <div class="trail-title"><strong>같은 이야기, 네 가지 수준</strong><small>오른쪽으로 갈수록 문장이 길고 복잡해집니다</small></div>

function bindStudy(){

  $("#optPr").onchange=e=>{ S.showPr=e.target.checked; store.set("showPr",S.showPr); const l=$("#sents"); if(l) l.classList.toggle("hide-pr",!S.showPr); };

function togglePlayAll(){
  const btn=$("#playAll");
  if (playAllOn){ stopAll(); return; }
  const t=topicObj(), L=t.L[S.level];
  if (S.compare){ speak(L.map(s=>s[0]).join(" ")); return; }
  playAllOn=true; btn.innerHTML=ICON.stop+"멈추기";
  let i=0;
  const next=()=>{
    document.querySelectorAll(".sent.playing").forEach(x=>x.classList.remove("playing"));

  };

function stopAll(){

/* ---------- pronunciation practice ---------- */
let activePractice=null;
async function practice(li, target, btn){
  if (activePractice){ const same = activePractice.li===li; activePractice.finish(); if(same) return; }
  stopSpeak();
  let box=li.querySelector(".check");
  if(!box){ box=document.createElement("div"); box.className="check"; li.appendChild(box); }
  box.innerHTML=`<p class="status">마이크 준비 중…</p>`;
  let stream=null, rec=null, chunks=[], recog=null, finalText="", alts=[], done=false;
  const ctrl={li, abort(){ cleanup(); box.innerHTML=`<p class="status">연습을 멈췄습니다.</p>`; }, finish(){ try{ recog&&recog.stop(); }catch(e){} try{ rec&&rec.state!=="inactive"&&rec.stop(); }catch(e){} }};
  activePractice=ctrl;
  const setBtn=live=>{ btn.classList.toggle("live",live); btn.innerHTML= live? ICON.stop+"말하기 끝" : ICON.mic+"따라 말하기"; };
  function cleanup(){ done=true; setBtn(false); try{recog&&recog.abort();}catch(e){} try{ rec&&rec.state!=="inactive"&&rec.stop(); }catch(e){} if(stream) stream.getTracks().forEach(t=>t.stop()); if(activePractice===ctrl) activePractice=null; }

  try{ stream=await getStream(); }catch(e){ box.innerHTML=`<p class="status">${esc(micErrorText(e))}</p>`; activePractice=null; return; }
  let audioURL=null;
  const recDone = new Promise(res=>{
    try{
      rec=new MediaRecorder(stream); rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);
      rec.onstop=()=>{ if(chunks.length) audioURL=URL.createObjectURL(new Blob(chunks,{type:rec.mimeType||"audio/webm"})); res(); };
      rec.start();
    }catch(e){ res(); }
  });
  setBtn(true);
  if (!SR){
    box.innerHTML=`<p class="status">녹음 중입니다. 문장을 읽은 뒤 '말하기 끝'을 누르세요. (이 브라우저는 발음 인식을 지원하지 않아 녹음 비교만 가능합니다. 발음 채점은 Chrome·Edge에서 됩니다.)</p>`;
    const origFinish=ctrl.finish; ctrl.finish=()=>{ origFinish(); };
    await new Promise(r=>{ btn.addEventListener("click",r,{once:true}); ctrl.finish=()=>{ try{rec.stop();}catch(e){} r(); }; });
    try{ rec.state!=="inactive"&&rec.stop(); }catch(e){}
    await recDone; stream.getTracks().forEach(t=>t.stop()); setBtn(false); activePractice=null;
    box.innerHTML=`<div class="row">${audioURL?`<button class="btn" data-me>${ICON.me}내 녹음 듣기</button>`:""}<button class="btn" data-nat>${ICON.play}원어민 듣기</button></div>`;
    bindCompareBtns(box,audioURL,target); return;
  }
  recog=new SR(); recog.lang="en-US"; recog.interimResults=true; recog.maxAlternatives=3; recog.continuous=false;
  box.innerHTML=`<p class="status">듣고 있습니다. 문장을 또박또박 읽어 주세요…</p><p class="heard" id="interim"></p>`;
  recog.onresult=e=>{
    let interim="";
    for(let k=e.resultIndex;k<e.results.length;k++){
      const r=e.results[k];
      if(r.isFinal){ finalText+=r[0].transcript+" "; for(let a=0;a<r.length;a++) alts.push(r[a].transcript); }
      else interim+=r[0].transcript;
    }
    const el=box.querySelector("#interim"); if(el) el.textContent=(finalText+interim).trim();
  };
  let errMsg=null;
  recog.onerror=e=>{ if(e.error!=="aborted") errMsg=micErrorText(e); };
  recog.onend=async()=>{
    try{ rec&&rec.state!=="inactive"&&rec.stop(); }catch(e){}
    await recDone; if(stream) stream.getTracks().forEach(t=>t.stop()); setBtn(false);
    if (activePractice===ctrl) activePractice=null;
    if (done) return;
    if (!finalText.trim()){ box.innerHTML=`<p class="status">${esc(errMsg||"인식된 말이 없습니다. 다시 시도해 보세요.")}</p>${audioURL?`<div class="row" style="margin-top:8px"><button class="btn" data-me>${ICON.me}내 녹음 듣기</button><button class="btn" data-nat>${ICON.play}원어민 듣기</button></div>`:""}`; bindCompareBtns(box,audioURL,target); return; }
    let best=align(target, finalText), bestText=finalText.trim();
    alts.forEach(a=>{ const r=align(target,a); if(r.score>best.score){ best=r; bestText=a; } });
    showResult(box, target, best, bestText, audioURL);
  };
  try{ recog.start(); }catch(e){ box.innerHTML=`<p class="status">${esc(micErrorText(e))}</p>`; cleanup(); }
}
function bindCompareBtns(box,url,target){
  const me=box.querySelector("[data-me]"), nat=box.querySelector("[data-nat]");
  let audio=null;
  if(me) me.onclick=()=>{ stopSpeak(); if(audio){audio.pause();} audio=new Audio(url); audio.play(); };
  if(nat) nat.onclick=()=>{ if(audio) audio.pause(); speak(target); };
}
function showResult(box, target, r, heard, url){
  const missed=r.words.filter((w,k)=>r.marks[k]!=="ok");
  const tips=tipsFor(missed.map(w=>w.replace(/[^A-Za-z']/g,"")));
  const verdict = r.score>=90?"아주 좋아요. 원어민 속도로 한 번 더 도전해 보세요.": r.score>=70?"잘했어요. 빨간 단어만 다시 연습하면 됩니다.": r.score>=40?"절반 이상 전달됐어요. '천천히' 듣기 후 끊어 읽어 보세요.":"문장을 짧게 나눠서, 단어를 누르며 하나씩 따라 해 보세요.";
  box.innerHTML=`
    <div class="score"><span class="big">${r.score}점</span><span class="lbl">${esc(verdict)}</span></div>
    <p class="words">${r.words.map((w,k)=>`<span class="w ${r.marks[k]}" data-w="${esc(w.replace(/[^A-Za-z0-9']/g,""))}" title="눌러서 이 단어 듣기">${esc(w)}</span>`).join(" ")}</p>
    <p class="heard">인식된 문장: <b>${esc(heard)}</b></p>
    <div class="row">
      ${url?`<button class="btn" data-me>${ICON.me}내 녹음 듣기</button>`:""}
      <button class="btn" data-nat>${ICON.play}원어민 듣기</button>
      <span class="hint">두 소리를 번갈아 들으며 비교해 보세요.</span>
    </div>
    ${tips.length?`<p class="sec-t" style="margin-top:14px">발음 교정 포인트</p><ul class="tips">${tips.map(t=>`<li>${esc(t)}</li>`).join("")}</ul>`:""}
    <div class="legend"><span><i style="background:var(--ok-bg);border:1px solid var(--ok)"></i>정확</span><span><i style="background:var(--close-bg);border:1px solid var(--close)"></i>비슷함</span><span><i style="background:var(--miss-bg);border:1px solid var(--miss)"></i>인식 안 됨</span><span>단어를 누르면 천천히 들려줍니다</span></div>`;
  box.querySelectorAll(".w").forEach(s=>s.onclick=()=>speak(s.dataset.w,0.6));
  bindCompareBtns(box,url,target);
}

function buildQuestions(n){
  const shuffle=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);
  const intro=TOPICS[0];
  const sv=shuffle([...TOPICS.filter(t=>t.cat!=="rp"&&t.id!=="intro").map(t=>({q:t.q,ko:t.qko,ref:t.id})), ...EXTRA_Q.filter(e=>e.cat!=="rp")]);
  const rp=shuffle([...TOPICS.filter(t=>t.cat==="rp").map(t=>({q:t.q,ko:t.qko,ref:t.id,rp:true})), ...EXTRA_Q.filter(e=>e.cat==="rp").map(e=>({...e,rp:true}))]);
  const nrp = n<=3?1:(n<=5?2:3);
  return [{q:intro.q,ko:intro.qko,ref:"intro"}, ...sv.slice(0,n-1-nrp), ...rp.slice(0,nrp)];
}

function askQuestion(){

let answering=false, A=null;
async function startAnswer(){
  stopSpeak(); const ava=$("#ava"); ava&&ava.classList.remove("talk");
  let stream;
  try{ stream=await getStream(); }catch(e){ $("#live").textContent=micErrorText(e); return; }
  answering=true;
  A={stream, chunks:[], rec:null, recog:null, final:"", start:Date.now(), timer:null, url:null, stopped:false};
  try{ A.rec=new MediaRecorder(stream); A.rec.ondataavailable=e=>e.data.size&&A.chunks.push(e.data); A.rec.start(); }catch(e){}
  const btn=$("#ans"); btn.classList.add("live"); btn.innerHTML=ICON.stop+"답변 끝내기";
  $("#live").textContent= SR? "듣고 있습니다…" : "녹음 중입니다… (이 브라우저는 실시간 인식을 지원하지 않습니다)";
  if (SR){
    const startRecog=()=>{
      const r=new SR(); r.lang="en-US"; r.continuous=true; r.interimResults=true; A.recog=r;
      r.onresult=e=>{ let interim=""; for(let k=e.resultIndex;k<e.results.length;k++){ const x=e.results[k]; if(x.isFinal) A.final+=x[0].transcript.trim()+". "; else interim+=x[0].transcript; } const el=$("#live"); if(el) el.textContent=(A.final+interim).trim()||"듣고 있습니다…"; };
      r.onerror=e=>{ if(e.error==="not-allowed"||e.error==="service-not-allowed"){ const el=$("#live"); if(el) el.textContent=micErrorText(e); } };
      r.onend=()=>{ if(answering && !A.stopped) { try{ startRecog(); }catch(e){} } };
      try{ r.start(); }catch(e){}
    };
    startRecog();
  }
  A.timer=setInterval(()=>{
    const s=Math.floor((Date.now()-A.start)/1000); const el=$("#timer"); if(!el) return;
    el.textContent=Math.floor(s/60)+":"+String(s%60).padStart(2,"0"); el.classList.toggle("warn",s>=105);
    $("#tfill").style.width=Math.min(100,s/120*100)+"%";
    if (s>=120) stopAnswer();
  },250);
}
function stopAnswer(skipped){
  if(!A || A.stopped) return;
  const ab=$("#ans"); if(ab){ ab.disabled=true; ab.classList.remove("live"); ab.innerHTML=ICON.mic+"정리 중…"; }
  answering=false; A.stopped=true; clearInterval(A.timer);
  const secs=Math.max(1,Math.round((Date.now()-A.start)/1000));
  try{ A.recog&&A.recog.stop(); }catch(e){}
  const finish=()=>{
    A.stream.getTracks().forEach(t=>t.stop());
    const url = A.chunks.length? URL.createObjectURL(new Blob(A.chunks,{type:(A.rec&&A.rec.mimeType)||"audio/webm"})) : null;
    T.results.push({q:T.qs[T.i], text: skipped? "" : A.final.trim(), secs: skipped?0:secs, url: skipped?null:url, skipped:!!skipped});
    A=null; if (S.view==="test" && T.phase==="q") nextQ();
  };
  // allow recognition final results to arrive
  setTimeout(()=>{ if(A.rec && A.rec.state!=="inactive"){ A.rec.onstop=finish; try{A.rec.stop();}catch(e){finish();} } else finish(); }, SR? 700 : 0);
}
function nextQ(){
  T.i++; T.replays=0; T.showQ=false;
  if (T.i>=T.qs.length){ T.phase="result"; renderTest(); return; }
  renderTest(); askQuestion();
}

/* ---------- scoring ---------- */
const CONNECT = ["because","so","but","however","also","actually","for example","first","second","then","after that","when","while","although","since","which","who","where","that's why","to be honest","in the end","especially","usually","honestly","looking back","as a result","anyway","what i like"];
const IRREG = /\b(was|were|went|had|saw|did|got|took|made|came|found|felt|thought|told|said|became|began|bought|met|left)\b/;
function analyze(text, secs){
  const lower=(" "+text.toLowerCase()+" ");
  const words=(text.match(/[A-Za-z']+/g)||[]).length;
  const wpm= secs? Math.round(words/(secs/60)) : 0;
  const found=CONNECT.filter(c=>new RegExp("\\b"+c.replace(/'/g,"'")+"\\b").test(lower));
  const past = IRREG.test(lower) || /\b\w{3,}ed\b/.test(lower);
  const perfect = /\b(i've|have been|has been|we've|i have)\b/.test(lower);
  const rel = /\b(which|who|where)\b/.test(lower);
  const fillers=(lower.match(/\b(um+|uh+|erm)\b/g)||[]).length;
  let s = Math.min(words,180)/180*40 + Math.min(found.length,8)/8*25 + (past?8:0) + (perfect?7:0) + (rel?5:0);
  s += (wpm>=90&&wpm<=170)?15:(wpm>=60?8:(words?3:0));
  const lv = !words? "-" : s<22?"IL":s<35?"IM1":s<48?"IM2":s<62?"IM3":s<78?"IH":"AL";
  return {words,wpm,found,past,perfect,rel,fillers,score:Math.round(s),lv};
}
const LV_ORDER=["IL","IM1","IM2","IM3","IH","AL"];

function renderResults(){
  const rs=T.results.map(r=>({...r, a:analyze(r.text,r.secs)}));
  const scored=rs.filter(r=>r.a.words>0);
  const avg = scored.length? scored.reduce((n,r)=>n+r.a.score,0)/scored.length : 0;
  const overall = !scored.length? "-" : avg<22?"IL":avg<35?"IM1":avg<48?"IM2":avg<62?"IM3":avg<78?"IH":"AL";
  const totW=scored.reduce((n,r)=>n+r.a.words,0), totS=scored.reduce((n,r)=>n+r.secs,0);
  $("#main").innerHTML=`<div class="test">
    <div class="panel">
      <div class="overall"><div><div class="hint">간이 추정 등급</div><div class="lvbig">${overall}</div></div>
        <p style="margin:0;max-width:30em;color:var(--mute);font-size:14px">답변 길이, 연결어, 시제, 말하기 속도로 계산한 참고용 등급입니다. 실제 채점과 다를 수 있습니다. ${sampleFn?"문항별 'AI 첨삭 받기'로 더 자세한 평가를 받아 보세요.":""}</p></div>
      <div class="metrics">
        <div class="metric"><b>${rs.length}</b><span>응답 문항</span></div>
        <div class="metric"><b>${totW}</b><span>총 단어 수</span></div>
        <div class="metric"><b>${totS? Math.round(totW/(totS/60)):0}</b><span>평균 분당 단어</span></div>
        <div class="metric"><b>${Math.round(totS/Math.max(1,scored.length))}초</b><span>평균 답변 시간</span></div>
      </div>
      <div class="row"><button class="btn primary" id="again">${ICON.play}새 테스트</button><span class="hint">IH 이상은 보통 한 답변에 1분 30초 이상, 120단어 이상 말합니다.</span></div>
    </div>
    ${rs.map((r,k)=>resultItem(r,k)).join("")}
  </div>`;
  $("#again").onclick=()=>{ T.phase="setup"; renderTest(); };
  rs.forEach((r,k)=>bindResult(r,k));
}
function resultItem(r,k){
  const ref=TOPICS.find(t=>t.id===r.q.ref); const model=ref.L[T.model];
  const a=r.a;
  return `<details class="res" ${k===0?"open":""}>
    <summary><span class="lvtag">${r.skipped?"건너뜀":a.lv}</span><span class="qs">Q${k+1}. ${esc(r.q.q)}</span></summary>
    <div class="resbody">
      <p class="hint" style="margin:0 0 10px">${esc(r.q.ko)}</p>
      ${r.url?`<div class="row" style="margin-bottom:10px"><audio controls src="${r.url}" style="max-width:100%"></audio></div>`:""}
      <label class="hint" for="tx${k}">내 답변 (인식 결과를 고치거나 직접 입력할 수 있습니다)</label>
      <textarea id="tx${k}" data-k="${k}">${esc(r.text)}</textarea>
      <div class="metrics">
        <div class="metric"><b data-f="words">${a.words}</b><span>단어</span></div>
        <div class="metric"><b>${r.secs}초</b><span>답변 시간</span></div>
        <div class="metric"><b data-f="wpm">${a.wpm}</b><span>분당 단어</span></div>
        <div class="metric"><b data-f="lv">${a.lv}</b><span>간이 등급</span></div>
      </div>
      <div class="hint">사용한 연결어·구조</div>
      <div class="found" data-f="found">${foundChips(a)}</div>
      <div class="model"><div class="row" style="justify-content:space-between;margin-bottom:6px"><strong style="color:var(--pine)">${T.model} 모범 답안 (${esc(ref.name)})</strong><button class="btn" data-mplay="${k}">${ICON.play}듣기</button></div>
        <p>${esc(model.map(s=>s[0]).join(" "))}</p>
        ${S.showKo?`<p class="hint" style="margin:0">${esc(model.map(s=>s[1]).join(" "))}</p>`:""}
      </div>
      ${sampleFn?`<div class="row" style="margin-top:14px"><button class="btn primary" data-ai="${k}">AI 첨삭 받기</button><span class="hint">예상 등급, 고칠 문장, 더 나은 답변을 알려 줍니다.</span></div><div data-aiout="${k}"></div>`:""}
    </div>
  </details>`;
}
function foundChips(a){
  const extra=[]; if(a.past) extra.push("과거시제"); if(a.perfect) extra.push("현재완료"); if(a.rel) extra.push("관계사절");
  const items=[...a.found.map(f=>f), ...extra];
  const missing=["because","for example","however","that's why","looking back"].filter(x=>!a.found.includes(x)).slice(0,3);
  return (items.length? items.map(x=>`<span class="chip">${esc(x)}</span>`).join("") : `<span class="chip no">아직 없음</span>`) + missing.map(x=>`<span class="chip no">+ ${esc(x)} 써 보기</span>`).join("");
}
function bindResult(r,k){
  const ta=$(`#tx${k}`);
  ta.oninput=()=>{ r.text=ta.value; const a=analyze(r.text,r.secs||60); r.a=a; T.results[k].text=ta.value;
    const box=ta.closest(".resbody"); box.querySelector('[data-f="words"]').textContent=a.words; box.querySelector('[data-f="wpm"]').textContent=r.secs? a.wpm : "-"; box.querySelector('[data-f="lv"]').textContent=a.lv; box.querySelector('[data-f="found"]').innerHTML=foundChips(a); };
  const mp=document.querySelector(`[data-mplay="${k}"]`); if(mp) mp.onclick=()=>{ const ref=TOPICS.find(t=>t.id===r.q.ref); speak(ref.L[T.model].map(s=>s[0]).join(" ")); };
  const ai=document.querySelector(`[data-ai="${k}"]`); if(ai) ai.onclick=()=>aiFeedback(r,k,ai);
}
async function aiFeedback(r,k,btn){
  const out=document.querySelector(`[data-aiout="${k}"]`);
  const text=(r.text||"").trim();
  if (text.split(/\s+/).length<5){ out.innerHTML=`<p class="notice">분석하려면 답변이 다섯 단어 이상 필요합니다. 위 칸에 답변을 입력해 주세요.</p>`; return; }
  btn.disabled=true; out.innerHTML=`<p class="hint" style="margin-top:10px">AI가 답변을 읽는 중입니다… (10~40초)</p>`;
  const prompt=`You are an experienced OPIc (ACTFL Oral Proficiency Interview by computer) rater and English speaking coach for Korean learners.
Test-taker profile: Jace, a Korean man in his mid-fifties, works at Samsung SDS on the Digital SCM team (system improvement and operations), family of four (wife, son, daughter), lives in an apartment near Lake Park in Dongtan (a new city south of Seoul), walks around the lake with his wife for an hour after dinner, uses the outdoor exercise equipment and stretches often, watches movies at the CGV multiplex in Lake Park, remembers the Tomb Raider series most, his favorite actors are Angelina Jolie (adoption, charity, beauty), Matt Damon (about his age, very fit and disciplined in Christopher Nolan's The Odyssey) and Anne Hathaway (beautiful), recently saw the Korean film 'The Man Who Lives with the King' (왕과 사는 남자) and found it very sad, is interested in park golf, has traveled in Korea (Busan, Jeju, Chiaksan, Sokcho) and abroad (Europe, Southeast Asia), and his favorite trip was Boracay in the Philippines (great resort, fun water sports, liked staying in one place; the only hassle was taking a boat because the island has no airport). If the question is a role-play, judge whether he completed the task (asked 3-4 questions, or explained the problem and offered 2-3 alternatives).
Question: "${r.q.q}"
Answer duration: ${r.secs||"unknown"} seconds.
Transcribed answer (from speech recognition, may contain recognition errors; do not penalize obvious transcription glitches):
"""${text}"""

Evaluate the answer and respond ONLY with a JSON object, no markdown, in this exact shape:
{"level":"one of NL,NM,NH,IL,IM1,IM2,IM3,IH,AL","summary":"2 sentences in Korean explaining the level","strengths":["Korean, up to 3 items"],"fixes":[{"original":"a phrase or sentence from the answer","better":"a natural corrected English version","why":"short Korean reason"}],"next":["up to 3 concrete Korean tips to reach the next level"],"better_answer":"a natural English answer about 1 level higher than the estimated level, written in first person for this test-taker, keeping his facts, 90-160 words"}
Give up to 5 fixes, most important first.`;
  try{
    const d = await sampleFn.json(prompt, {modelTier:"default"});
    out.innerHTML=`<div class="ai">
      <h4>AI 예상 등급: ${esc(d.level||"-")}</h4><p style="margin:0">${esc(d.summary||"")}</p>
      ${(d.strengths||[]).length?`<h4>잘한 점</h4><ul>${d.strengths.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:""}
      ${(d.fixes||[]).length?`<h4>고쳐 말하기</h4>${d.fixes.map(f=>`<div class="fix"><s>${esc(f.original)}</s><br><ins>${esc(f.better)}</ins> <button class="btn" style="padding:2px 8px;font-size:12px" data-say="${esc(f.better)}">${ICON.play}</button><div class="hint">${esc(f.why)}</div></div>`).join("")}`:""}
      ${(d.next||[]).length?`<h4>다음 등급으로 가려면</h4><ul>${d.next.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:""}
      ${d.better_answer?`<h4>한 단계 높인 답변</h4><p style="font-family:var(--serif);font-size:15px;margin:0 0 6px">${esc(d.better_answer)}</p><button class="btn" data-say="${esc(d.better_answer)}">${ICON.play}듣기</button>`:""}
    </div>`;
    out.querySelectorAll("[data-say]").forEach(b=>b.onclick=()=>speak(b.dataset.say));
  }catch(e){
    const code=e&&e.code;
    if (code==="not_granted"){ out.innerHTML=`<p class="notice">AI 첨삭이 허용되지 않았습니다. 이번 화면에서는 간이 분석만 사용할 수 있습니다.</p>`; document.querySelectorAll("[data-ai]").forEach(b=>b.closest(".row").remove()); sampleFn=null; return; }
    out.innerHTML=`<p class="notice">${code==="rate_limited"?"요청이 많습니다. 잠시 후 다시 눌러 주세요.":"AI 첨삭을 받지 못했습니다. 잠시 후 다시 시도해 주세요."}</p>`;
  }finally{ btn.disabled=false; }
}

/* ---------- nav ---------- */
function setView(v){
  stopAll(); if(answering) stopAnswer(true);
  if (S.view==="test" && v!=="test" && T.phase==="q"){ T.phase = T.results.length? "result" : "setup"; }
  S.view=v;
  $("#tab-study").setAttribute("aria-selected", v==="study"); $("#tab-test").setAttribute("aria-selected", v==="test");
  if (v==="study") renderStudy(); else renderTest();
  window.scrollTo({top:0});
}
$("#tab-study").onclick=()=>setView("study");
$("#tab-test").onclick=()=>setView("test");
renderStudy();
})();
</script>

    bg.addEventListener("click", function(ev){ if (ev.target === bg || ev.target.tagName === "BUTTON") bg.remove(); });

})();
